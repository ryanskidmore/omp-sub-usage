name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest omp, so a host API change shows up
  # before anyone hits it in a real session.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # oh-my-pi is a dev dependency with a large dependency tree.
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and format check
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test

  integration:
    name: Integration (omp ${{ matrix.omp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # locked: the version in bun.lock. latest: whatever npm has today.
        omp: [locked, latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Upgrade omp to latest
        if: matrix.omp == 'latest'
        run: bun add --dev @oh-my-pi/pi-coding-agent@latest
      - name: Show omp version
        run: ./node_modules/.bin/omp --version
      # Boots real omp in RPC mode: once with the plugin passed via -e, once
      # installed through `omp plugin link` and configured via `omp plugin config`.
      - name: Run plugin inside omp
        run: bun run test:integration
