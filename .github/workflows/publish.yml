name: Publish

# Push a tag matching package.json's version (`v0.2.0`) to publish that
# version to npm and create its GitHub release. npm authenticates with
# trusted publishing (OIDC), so no npm token is stored in the repository.
# See the README's "Releasing" section.
#
# Every step skips work that is already done, so re-running a failed run
# (or tagging a version that was published by hand) finishes the job.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Version from package.json#packageManager.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      # npm does the publishing; trusted publishing needs npm >= 11.5.1.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag matches package.json
        id: version
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "spec=${name}@${version}" >> "$GITHUB_OUTPUT"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm; only the release will be created"
          fi
      # No dependency cache: release builds install from scratch.
      - name: Install dependencies
        if: steps.version.outputs.published != 'true'
        run: bun install --frozen-lockfile
      - name: Lint, typecheck, unit and integration tests
        if: steps.version.outputs.published != 'true'
        run: bun run check
      # --ignore-scripts: prepublishOnly only guards against publishing by hand.
      - name: Publish to npm
        if: steps.version.outputs.published != 'true'
        run: npm publish --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ steps.version.outputs.spec }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Install: \`omp plugin install ${SPEC}\` · [npm](https://www.npmjs.com/package/${SPEC%@*}/v/${SPEC##*@})"
